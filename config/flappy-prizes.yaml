behaviors:
  FlappyBird3D:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 8192
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 500000
    time_horizon: 128
    summary_freq: 10000
    checkpoint_interval: 100000
    keep_checkpoints: 6
environment_parameters:
  prize_reward: 5.0
  collision_penalty: 10.0
  alignment_reward: 0.3
  random_initial_lives: 0.0
